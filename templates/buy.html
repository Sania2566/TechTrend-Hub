{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: url("{% static 'images/bgimg.jpg' %}?v=3") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .main-wrapper {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .glass-card {
      width: 100%;
      max-width: 720px;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      color: #fff;
      padding: 1.5rem;
    }

    h3, h5 {
      color: #ffffff;
      text-shadow: 0 0 3px rgba(0,0,0,0.5);
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    .form-label, .form-check-label {
      color: #f0f0f0;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }

    .form-control {
      background-color: rgba(255,255,255,0.85);
      color: #000;
      border: none;
      height: 32px;
      padding: 4px 8px;
      font-size: 0.9rem;
    }

    .form-control::placeholder {
      color: #666;
    }

    .form-control:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.3);
    }

    .form-check-input:checked {
      background-color: #d8a116;
      border-color: #ffffff;
    }

    .btn-primary {
      background-color: #7e57c2;
      border-color: #7e57c2;
      font-weight: bold;
      font-size: 1rem;
      padding: 6px 12px;
    }

    .btn-primary:hover {
      background-color: #5e35b1;
      border-color: #5e35b1;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(94, 53, 177, 0.3);
    }

    .row > .col-md-6, .row > .col-md-3 {
      padding-right: 0.4rem;
      padding-left: 0.4rem;
    }

    .form-check {
      margin-bottom: 0.3rem;
    }

    @media (max-height: 700px) {
      .glass-card {
        transform: scale(0.95);
      }
    }

    @media (max-width: 576px) {
      .glass-card {
        transform: scale(0.9);
      }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="glass-card">
    <h3 class="text-center">Payment Information 💳</h3>

    <form>
      <h5>🏠 Billing</h5>
      <div class="row">
        <div class="col-md-6 mb-2">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="col-md-6 mb-2">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="mb-2">
        <label class="form-label">Address</label>
        <input type="text" class="form-control" placeholder="1234 Main St" required>
      </div>
      <div class="mb-2">
        <label class="form-label">City</label>
        <input type="text" class="form-control" placeholder="City" required>
      </div>

      <h5 class="mt-3">💰 Method</h5>
<div class="form-check mb-2">
  <input class="form-check-input" type="radio" name="paymentMethod" id="creditCard" checked>
  <label class="form-check-label ms-2" for="creditCard">💳 Credit card</label>
</div>
<div class="form-check mb-2">
  <input class="form-check-input" type="radio" name="paymentMethod" id="debitCard">
  <label class="form-check-label ms-2" for="debitCard">🏧 Debit card</label>
</div>
<div class="form-check mb-2">
  <input class="form-check-input" type="radio" name="paymentMethod" id="paypalOption">
  <label class="form-check-label ms-2" for="paypalOption">🅿️ PayPal</label>
</div>


      <div class="row mt-2">
        <div class="col-md-6 mb-2">
          <label class="form-label">Name on card</label>
          <input type="text" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="col-md-6 mb-2">
          <label class="form-label">Card number</label>
          <input type="text" class="form-control" placeholder="1111-2222-3333-4444" required>
        </div>
        <div class="col-md-3 mb-2">
          <label class="form-label">Expiry</label>
          <input type="text" class="form-control" placeholder="MM/YY" required>
        </div>
        <div class="col-md-3 mb-2">
          <label class="form-label">CVV</label>
          <input type="text" class="form-control" placeholder="123" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-2">🛒 Pay Now</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
